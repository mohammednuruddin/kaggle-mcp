[project]
name = "kaggle-mcp"
version = "0.1.0"
description = "An MCP server that connects a local agent to a live Kaggle notebook session"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp==2.14.5",
    "mcp[cli]>=1.20.0",
    "jupyter-kernel-client>=0.9.0,<1.0",
    "kagglesdk>=0.1.37,<1.0",
]

[project.scripts]
kaggle-mcp = "kaggle_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter-server>=2.14",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
